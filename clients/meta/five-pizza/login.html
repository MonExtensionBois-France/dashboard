<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Five Pizza Original — Connexion</title>
<link rel="icon" href="https://fivepizzaoriginal.com/wp-content/uploads/2022/07/logo-typo-blanc-f-noir0-150x150.png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--surface:#111;--card:#1A1A1A;
  --yellow:#FAEB8E;--yellow-dim:rgba(250,235,142,.15);
  --green:#61CE70;--white:#FFF;--text:#7A7A7A;
  --heading:'Oswald',sans-serif;--font:'Open Sans',sans-serif;
  --radius:5px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--black);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

.login-container{width:100%;max-width:400px;text-align:center}

.login-logo{width:min(200px,50vw);height:auto;margin:0 auto 32px;filter:drop-shadow(0 0 20px rgba(250,235,142,.15))}

.login-title{font-family:var(--heading);font-size:clamp(18px,4vw,24px);font-weight:700;text-transform:uppercase;letter-spacing:3px;color:var(--yellow);margin-bottom:8px}

.login-subtitle{font-size:13px;color:var(--text);margin-bottom:32px}

.login-form{display:flex;flex-direction:column;gap:16px}

.login-input{font-family:var(--font);font-size:15px;padding:14px 18px;background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);color:var(--white);outline:none;transition:border-color .3s}
.login-input:focus{border-color:var(--yellow)}
.login-input::placeholder{color:var(--text)}

.login-btn{font-family:var(--heading);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:2px;padding:14px;background:var(--yellow);color:var(--black);border:none;border-radius:var(--radius);cursor:pointer;transition:all .3s}
.login-btn:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 16px rgba(250,235,142,.3)}
.login-btn:active{transform:translateY(0)}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.login-error{font-size:13px;color:#e74c3c;min-height:20px;margin-top:4px;opacity:0;transition:opacity .3s}
.login-error.show{opacity:1}

.login-footer{margin-top:48px;font-size:11px;color:rgba(255,255,255,.15);letter-spacing:1px}
.login-footer a{color:rgba(250,235,142,.3);text-decoration:none}
</style>
</head>
<body>
<div class="login-container">
  <img src="https://fivepizzaoriginal.com/wp-content/uploads/2022/07/Logo-Five-Pizza-Original.png" alt="Five Pizza Original" class="login-logo">
  <div class="login-title">Dashboard Marketing</div>
  <div class="login-subtitle">Accès réservé — Saisissez votre mot de passe</div>
  <form class="login-form" id="loginForm">
    <input type="password" class="login-input" id="passwordInput" placeholder="Mot de passe" autocomplete="current-password" required>
    <button type="submit" class="login-btn" id="loginBtn">Accéder</button>
    <div class="login-error" id="loginError"></div>
  </form>
  <div class="login-footer">Propulsé par <a href="https://meta-advertising.io" target="_blank">Meta-Advertising</a></div>
</div>
<script>
(function(){
  var form=document.getElementById('loginForm');
  var input=document.getElementById('passwordInput');
  var btn=document.getElementById('loginBtn');
  var errorEl=document.getElementById('loginError');

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var pw=input.value;
    if(!pw)return;
    btn.disabled=true;
    btn.textContent='Vérification…';
    errorEl.classList.remove('show');
    errorEl.textContent='';

    fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pw})
    }).then(function(r){
      if(r.ok) return r.json().then(function(){window.location.href='/';});
      return r.json().then(function(data){
        errorEl.textContent=data.error||'Accès refusé.';
        errorEl.classList.add('show');
        input.value='';
        input.focus();
      });
    }).catch(function(){
      errorEl.textContent='Erreur de connexion. Réessayez.';
      errorEl.classList.add('show');
    }).finally(function(){
      btn.disabled=false;
      btn.textContent='Accéder';
    });
  });

  input.focus();
})();
</script>
</body>
</html>
